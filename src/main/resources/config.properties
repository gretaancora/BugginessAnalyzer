# ---------------------------------------------------------------
# BugginessAnalyzer - configurazione
# ---------------------------------------------------------------

# Progetto analizzato
project.name=OPENJPA
jira.project.key=OPENJPA

# Snapshot delle versioni Jira (congelato per riproducibilita').
# Se il file non esiste viene scaricato da Jira e salvato in questo percorso.
jira.versions.snapshot=data/openjpa_versions.json

# Repository Git: se git.local.path non esiste viene clonato da git.remote.url
git.remote.url=https://github.com/apache/openjpa.git
git.local.path=repos/openjpa

# Percentuale di release (le piu' vecchie) da tenere nel dataset:
# "ignora l'ultimo 66%" -> si tiene floor(n * 34 / 100)
releases.kept.percentage=34

# Release di pre-rilascio (milestone, alpha, beta, RC): escluse
releases.prerelease.regex=.*-(M\\d+|alpha\\d*|beta\\d*|RC\\d*)$

# Suffissi provati per trovare il tag Git di una versione Jira (separati da virgola;
# la stringa vuota significa "nome identico")
releases.tag.suffixes=,-incubating

# Release senza tag: commit di riferimento scelto manualmente (versione=hash, separati da virgola)
# 0.9.0: commit "Updated to final 0.9.0-incubating release number" (2006-10-09)
releases.manual.refs=0.9.0=2fbc438887e051c505e926e2ddecb9c2676680a4

# Ticket di bug (snapshot congelato; se manca viene scaricato con la ricerca JQL)
jira.tickets.snapshot=data/openjpa_bugs.json
jira.tickets.jql=project = OPENJPA AND issuetype = Bug AND status in (Closed, Resolved) AND resolution = Fixed ORDER BY key ASC

# Classi analizzate: file .java che corrispondono a include e non a exclude (percorsi relativi alla radice)
classes.include.regex=(.*/)?src/main/java/.*\\.java
classes.exclude.regex=openjpa-examples/.*

# Commit con piu' di questo numero di file .java di produzione modificati: esclusi dalle metriche di processo
metrics.mass.commit.threshold=300

# Cartella dove viene estratto il codice di ogni release (per CK e SonarCloud)
work.dir=work

# SonarCloud: un progetto pubblico per release, chiave <organizzazione>_<prefisso>-<versione>
sonar.host.url=https://sonarcloud.io
sonar.organization=gretaancora
sonar.project.prefix=openjpa
# cli = sonar-scanner installato e nel PATH; docker = immagine sonarsource/sonar-scanner-cli
sonar.scanner.mode=cli
sonar.scanner.command=sonar-scanner
sonar.scanner.docker.image=sonarsource/sonar-scanner-cli
sonar.source.encoding=UTF-8
# true per rianalizzare anche le release che hanno gia' un'analisi
sonar.reanalyze=false
sonar.task.timeout.minutes=30
# Token: variabile d'ambiente SONAR_TOKEN, oppure sonar.token=<token> in questo file
sonar.token.file=secrets.properties

# Cartella dei file di output
output.dir=output
