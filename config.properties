# ---------------------------------------------------------------
# BugginessAnalyzer - configurazione
# ---------------------------------------------------------------

# Progetto analizzato
project.name=OPENJPA
jira.project.key=OPENJPA

# Snapshot delle versioni Jira (congelato per riproducibilita').
# Se il file non esiste viene scaricato da Jira e salvato in questo percorso.
jira.versions.snapshot=data/openjpa_versions.json

# Repository Git: se git.local.path non esiste viene clonato da git.remote.url
git.remote.url=https://github.com/apache/openjpa.git
git.local.path=repos/openjpa

# Percentuale di release (le piu' vecchie) da tenere nel dataset:
# "ignora l'ultimo 66%" -> si tiene floor(n * 34 / 100)
releases.kept.percentage=34

# Release di pre-rilascio (milestone, alpha, beta, RC): escluse
releases.prerelease.regex=.*-(M\\d+|alpha\\d*|beta\\d*|RC\\d*)$

# Suffissi provati per trovare il tag Git di una versione Jira (separati da virgola;
# la stringa vuota significa "nome identico")
releases.tag.suffixes=,-incubating

# Release senza tag: commit di riferimento scelto manualmente (versione=hash, separati da virgola)
# 0.9.0: commit "Updated to final 0.9.0-incubating release number" (2006-10-09)
releases.manual.refs=0.9.0=2fbc438887e051c505e926e2ddecb9c2676680a4

# Cartella dei file di output
output.dir=output
